# 疊加層:把容器併入現有 Miniflux 的 Docker 網路(預設 miniflux_default),
# 讓 Miniflux 容器能用內部 DNS 名 http://shinkansen-rss:8088/rss/<id> 抓取譯後 feed。
#
# 用法:docker compose -f docker-compose.yml -f docker-compose.miniflux.yml up -d --build
name: shinkansen-rss-translator

services:
  app:
    networks:
      - miniflux

networks:
  miniflux:
    name: miniflux_default
    external: true
